<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSA Cast Receiver</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:white;font-family:system-ui,Arial,sans-serif;text-align:center}main{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3vh 4vw}#brand{font-size:3vw;font-weight:900}#title{font-size:3.1vw;font-weight:800;max-width:96vw}#clock{font-size:22vw;line-height:1;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-.06em}#meta{font-size:2.8vw;font-weight:800}#record{font-size:2.2vw;color:#ff304e;font-weight:900}#status{font-size:1.5vw;color:#9aabbc}.flash{animation:blink .5s steps(1,end) infinite}@keyframes blink{50%{opacity:.12}}</style></head><body><main><div id="brand">BSA · SWIM SESSION RUNNER</div><div id="title">Waiting for Samsung controller</div><div id="clock">00:00</div><div id="meta">READY</div><div id="record"></div><div id="status">CONNECT YOUR PHONE</div></main><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><script>
'use strict';const NS='urn:x-cast:au.com.bsa.swimrunner.clock';const $=id=>document.getElementById(id);let last=null,received=0;
function fmt(t){t=Math.max(0,Math.ceil(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function receive(data){if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){return}}if(!data||data.type!=='clock'||typeof data.remaining!=='number')return;last=data;received=performance.now()}
function paint(){if(!last)return;const age=(performance.now()-received)/1000;const left=last.running?Math.max(0,last.remaining-age):last.remaining;const flash=last.running&&left>0&&left<=5;const colours={'effort-red':'#ff304e','effort-orange':'#ff991e','effort-green':'#30e879','effort-blue':'#459dff'};
$('clock').textContent=fmt(left);$('clock').style.color=flash?(colours[last.effort]||'#fff'):'#fff';$('clock').classList.toggle('flash',flash);$('title').textContent=last.title||'Ready';$('meta').textContent=last.rest?'60-SECOND SET BREAK':`SET ${last.set}/${last.total} · REP ${last.rep}/${last.reps} · ${last.effortLabel||''}`;$('record').textContent=last.record?'RECORD: '+(last.requirements||[]).join(' · '):'';$('status').textContent=age>4?'⚠ PHONE CONNECTION STALE — CHECK CONTROLLER':(last.running?'● LIVE · CHROMECAST':'PAUSED / READY')}
setInterval(paint,100);const context=cast.framework.CastReceiverContext.getInstance();context.addCustomMessageListener(NS,e=>receive(e.data));context.start({disableIdleTimeout:true});
</script></body></html>
